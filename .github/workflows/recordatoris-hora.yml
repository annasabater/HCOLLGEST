# Recordatoris amb hora pròpia: Vercel Hobby només permet un cron al dia.
# Qui crida l'endpoint cada minut és SUPABASE (pg_cron + pg_net, job
# «recordatoris-hora», clau a Vault «cron_hora_secret»), perquè el `schedule` de
# GitHub no arrencava i s'endarreria. Aquest workflow queda NOMÉS per engegar-lo a
# mà (Actions → Run workflow). No hi tornis a posar `schedule`: si dos criden alhora,
# el mateix avís podria sortir dues vegades. Secret: CRON_HORA_SECRET (el mateix que a Vercel).
name: Recordatoris a l'hora

on:
  workflow_dispatch:

permissions: {}

jobs:
  avisa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Crida l'endpoint
        env:
          SECRET: ${{ secrets.CRON_HORA_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://gestio.hostalcoll.com/api/cron/recordatoris-hora
