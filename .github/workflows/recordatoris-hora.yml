# Recordatoris amb hora pròpia: Vercel Hobby només permet un cron al dia, així
# que aquest workflow crida l'endpoint cada 10 minuts. GitHub pot endarrerir-lo
# uns minuts. Secret necessari al repositori: CRON_HORA_SECRET (el mateix que a Vercel).
name: Recordatoris a l'hora

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  avisa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Crida l'endpoint
        env:
          SECRET: ${{ secrets.CRON_HORA_SECRET }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $SECRET" https://gestio.hostalcoll.com/api/cron/recordatoris-hora
